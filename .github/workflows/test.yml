name: test
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * *"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s tests -v
      - run: python3 -I -m py_compile scripts/gen_catalog.py scripts/bump_catalog.py scripts/catalog_schema.py scripts/schema_base.py scripts/schema_rules.py scripts/schema_rules_content.py scripts/schema_xml.py scripts/catalog_net.py scripts/catalog_check.py
      - run: python3 -I scripts/gen_catalog.py --check
        env:
          GH_TOKEN: ${{ github.token }}
  # Manual and scheduled runs also check the published catalog (the same script sign.yml runs after signing).
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/verify-catalog.sh
