# Generates catalog.xml from packages.toml and the public releases, signs it with the project's signing subkey and
# commits catalog.xml and catalog.xml.asc together (one commit: clients never see a catalog without its signature).
# Runs when the package list changes, every Monday and Thursday (the catalog is valid for 35 days, so about ten runs may
# fail before it lapses), and by hand. Then the job `verify` checks the published catalog (scripts/verify-catalog.sh). A failed run (either job) opens (or
# updates) the issue "catalog signing failed"; the next green run closes it again. No secret is ever printed.
# Needs the secrets GPG_PRIVATE_KEY and GPG_PASSPHRASE (scripts/set-signing-secrets.sh in fs-release).
name: sign
on:
  push:
    branches: [main]
    paths: [packages.toml, scripts/gen_catalog.py, scripts/catalog_schema.py, scripts/schema_base.py, scripts/schema_rules.py, scripts/schema_rules_content.py, scripts/schema_xml.py, scripts/catalog_net.py, scripts/catalog_check.py]
  schedule:
    - cron: "17 4 * * 1,4"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: sign
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/gen_catalog.py
      - name: Sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          rm -f catalog.xml.asc
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign -o catalog.xml.asc catalog.xml
          gpg --batch --verify catalog.xml.asc catalog.xml
      - name: Commit catalog and signature together
        run: |
          git config user.name "FreeSynergy Release"
          git config user.email "support@freesynergy.net"
          git add catalog.xml catalog.xml.asc catalog.drafts
          git commit -m "chore: refresh and sign catalog.xml"
          # bump may have pushed packages.toml meanwhile: rebase onto it and try again; still failing = red run
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          echo "::error::could not push the signed catalog after 3 attempts"
          exit 1
      - name: Make a failed run visible
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "::error title=catalog signing failed::catalog.xml was NOT renewed; see $url"
          body="The sign workflow failed (${GITHUB_EVENT_NAME}): ${url}
          The published catalog.xml stays as it was and expires on its fs-expires date. Look at the failed step; common causes are a missing GPG secret, a package without a published release, or a push conflict."
          n=$(gh issue list --state open --search '"catalog signing failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "Failed again: $url"; else gh issue create --title "catalog signing failed" --body "$body"; fi
  # Same run, no extra token: a push with GITHUB_TOKEN starts no other workflow, so the check of the PUBLISHED catalog
  # (fresh clone, signature against the project key, every tag present) runs here, after the push, as a second job.
  # Red = the "catalog signing failed" issue; the green run closes it.
  # TODO(fs-release, separate order): once FreeSynergy/fs-release/.github/workflows/_notify-red.yml exists, call it from
  # both jobs with `uses: ...@<tag or SHA>` (issue "rot: sign fs-catalog", label rot, duplicate guard, closes on green).
  verify:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the published catalog
        run: scripts/verify-catalog.sh
      - name: Close the failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search '"catalog signing failed" in:title' --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Green again: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done
      - name: Make a failed run visible
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "::error title=catalog signing failed::the published catalog failed its check; see $url"
          body="The sign workflow (verify job) failed (${GITHUB_EVENT_NAME}): ${url}
          The published catalog.xml stays as it was and expires on its fs-expires date. Look at the failed step; common causes are a missing GPG secret, a package without a published release, or a push conflict."
          n=$(gh issue list --state open --search '"catalog signing failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "Failed again: $url"; else gh issue create --title "catalog signing failed" --body "$body"; fi
