# The packages this catalog offers. One table per package; `tag` is the release tag in `repo`.
# `python3 scripts/gen_catalog.py` reads the public release and writes catalog.xml; CI does it and signs (sign.yml).
# Versions count 0.0.N (ADR 0064).

[[package]]
id = "fs-store"
name = "FreeSynergy.Store"
summary = "Install, update and extend FreeSynergy programs"
description = "The store of FreeSynergy: it installs the programs you choose from signed catalogs, keeps them up to date, and takes them away again. Every file is checked against the project key before anything is installed, and a failed update is rolled back."
repo = "FreeSynergy/fs-store"
tag = "v0.0.1"
asset = "fs-store-{version}-linux-x86_64.tar.gz"
kind = "program"

[[package]]
id = "fs-tasks"
name = "FreeSynergy.Tasks"
summary = "Tasks and Kanban"
description = "Plan what has to be done: lists, status and Kanban views, due dates, relations between tasks, and import and export as iCalendar. Your tasks stay in your own data folder."
repo = "FreeSynergy/fs-tasks"
tag = "v0.0.2"
asset = "fs-tasks-{version}-linux-x86_64.tar.gz"
kind = "program"

[[package]]
id = "fs-people"
name = "FreeSynergy.People"
summary = "People and contacts"
description = "Your people and contacts: cards with names, mail, phone and notes, groups of people, and vCard import and export. Everything stays in your own data folder."
repo = "FreeSynergy/fs-people"
tag = "v0.0.2"
asset = "fs-people-{version}-linux-x86_64.tar.gz"
kind = "program"
